services:
  localstack:
    image: localstack/localstack:3.8.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d

  oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "9000:9000"
    environment:
      - SERVER_PORT=9000
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./mock-oauth/config.json:/config/config.json